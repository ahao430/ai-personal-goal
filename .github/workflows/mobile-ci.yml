# mobile（Flutter App）CI：代码检查 + 全量测试 + 打包产物
#
# 触发条件（见 .github/workflows/README.md 触发矩阵）：
# - push 到 main 且变更涉及 apps/mobile/** 或本 workflow 文件
# - 涉及上述路径的 PR
# - 手动触发（workflow_dispatch）
#
# 注意：发版（tag mobile-v* → GitHub Release）在 mobile-release.yml，
# 两者分开是因为 paths 过滤会作用于 tag 事件，混在一个文件里会漏发版。

name: mobile-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/mobile

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: build apk
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # 拆 ABI：单设备实际下载体积（arm64 约 24MB）
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14
